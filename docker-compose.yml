name: ${COMPOSE_PROJECT_NAME:-herbal_store_mvp_dev}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-herbal_store}
      POSTGRES_USER: ${POSTGRES_USER:-herbal_store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --timeout=60
      - --access-logfile=-
      - --error-logfile=-
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    networks:
      - app_network
      - db_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=4).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  web:
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"
      - "${WEB_LAN_IP:-192.168.127.236}:${WEB_HTTP_PORT:-8080}:80"
      # - "${WEB_LAN_IP:-10.120.26.236}:${WEB_HTTP_PORT:-8080}:80"
      # - "192.168.127.236:${WEB_HTTP_PORT:-8080}:80"

    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

networks:
  app_network:
  db_network:
    internal: true

volumes:
  postgres_data:
  static_data:
  media_data:
